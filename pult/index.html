<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<title>Пульт «Вершина»</title>
<meta name="apple-mobile-web-app-title" content="Пульт Вершина">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="theme-color" content="#283873">
<link rel="icon" href="../assets/logo.png">
<link rel="apple-touch-icon" href="icon.png">
<style>
html,body{margin:0;height:100%;background:#f2f5fc;font-family:system-ui,sans-serif}
iframe{position:fixed;inset:0;width:100%;height:100%;border:0}
.load{position:fixed;inset:0;display:grid;place-items:center;text-align:center;color:#283873;font-weight:700;padding:24px}
.load small{display:block;margin-top:14px;font-weight:600;color:#5b6588}
.load a{color:#3557d8}
</style>
</head>
<body>
<div class="load" id="load"><div>Открываю пульт…<small>Если долго не открывается — <a id="direct" target="_top">нажмите сюда</a></small></div></div>
<iframe id="app" title="Пульт сайта «Вершина»" allow="clipboard-write"></iframe>
<script>
// Ссылка на «Пульт сайта» (Google Apps Script). Меняется только здесь.
const PULT = 'https://script.google.com/macros/s/AKfycbwCPWElhR2SyivgctH5khOF90mNTRNXftdIjBGHzx4FW9Rnp4NE-u6UHbj3AtfvxBl5/exec';
document.getElementById('direct').href = PULT;
const f = document.getElementById('app');
f.onload = () => setTimeout(() => document.getElementById('load').remove(), 300);
f.src = PULT;
</script>
</body>
</html>
